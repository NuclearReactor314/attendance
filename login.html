<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Login</h1>
    <input type="text" id="username" placeholder="请输入名字"><br>
    <input type="password" id="password" placeholder="管理员密码（仅管理员）"><br>
    <button onclick="login()">登录</button>
    <p id="message" style="color:red;"></p>
  </div>

  <script>
    function login() {
      const name = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;

      if(!name) {
        document.getElementById('message').textContent = '请输入名字';
        return;
      }

      if(name === 'admin') {
        if(password === '120203') {
          localStorage.setItem('role', 'admin');
          localStorage.setItem('name', 'admin');
          window.location.href = 'admin.html';
        } else {
          document.getElementById('message').textContent = '管理员密码错误';
        }
      } else {
        localStorage.setItem('role', 'employee');
        localStorage.setItem('name', name);
        window.location.href = 'employee.html';
      }
    }
  </script>
</body>
</html>
